<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225" role="img" aria-label="ResearchAI Technology Trends Advisor">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16242e"/>
      <stop offset="1" stop-color="#0e1519"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#rbg)"/>
  <!-- RAG node network -->
  <g stroke="#F96D00" stroke-width="2" opacity="0.85">
    <line x1="66" y1="60" x2="146" y2="40"/>
    <line x1="66" y1="60" x2="134" y2="104"/>
    <line x1="146" y1="40" x2="224" y2="70"/>
    <line x1="134" y1="104" x2="224" y2="70"/>
    <line x1="224" y1="70" x2="298" y2="50"/>
  </g>
  <g fill="#ffbd39">
    <circle cx="66" cy="60" r="8"/>
    <circle cx="146" cy="40" r="8"/>
    <circle cx="134" cy="104" r="8"/>
    <circle cx="224" cy="70" r="10"/>
    <circle cx="298" cy="50" r="8"/>
  </g>
  <!-- trend chart -->
  <polyline points="58,164 106,146 146,153 196,120 244,130 314,90" fill="none" stroke="#F96D00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M314 90 l-14 3 l6 -13 z" fill="#F96D00"/>
  <!-- magnifier -->
  <circle cx="316" cy="128" r="24" fill="none" stroke="#fff" stroke-width="6"/>
  <line x1="333" y1="145" x2="352" y2="164" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <!-- caption -->
  <text x="22" y="192" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="25" font-weight="700">ResearchAI</text>
  <text x="22" y="213" fill="#ffbd39" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600">Trends Advisor · RAG + MLOps</text>
</svg>
